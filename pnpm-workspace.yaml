packages:
  - 'worker'

# A pnpm 10 alapból blokkolja a függőségek install-scriptjeit. Az esbuild (vite + tsx)
# postinstallja ellenőrzi/kicsomagolja a platform-specifikus binárist, e nélkül a build
# és a worker indítása is elhasalhat. Új warning esetén: `pnpm approve-builds`.
onlyBuiltDependencies:
  - esbuild
