# Local development/testing: builds the stack from source instead of using GHCR.
# Compose loads this automatically alongside docker-compose.yml, so it's enough to run:
#
#   docker compose up --build
#
# ONLY docker-compose.yml ships to the Pi — this file isn't present there.

services:
  web:
    build:
      context: .
      target: web
      args:
        # Same public keys that CI passes in as build args.
        # Sourced locally from the project root's .env.
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID:-}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_SHOW_SKILL_PROGRESS: ${VITE_SHOW_SKILL_PROGRESS:-}
    pull_policy: build
    # Ports come from docker-compose.yml; if port 80 is taken on your machine,
    # put HTTP_PORT=8080 in your .env.

  api:
    build:
      context: .
      target: api
    pull_policy: build
    # Handy to reach directly when developing locally (curl localhost:3001/healthz).
    ports:
      - "${API_PORT:-3001}:3001"

  worker:
    build:
      context: .
      target: worker
    pull_policy: build
