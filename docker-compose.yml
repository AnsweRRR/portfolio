# Portfolio stack — this is the file that ships to the Raspberry Pi.
#
# DEFAULT: `worker`, `cms`, `cms-proxy`, and `cloudflared` start. The webapp
# and API run on Vercel; the Pi's job is the long-running Tuya -> Supabase
# worker plus the self-hosted Payload CMS (blog) — Vercel can't host Payload,
# it needs a persistent server + DB connection, not a serverless function.
# `cloudflared` exposes cms-proxy to the internet via a Cloudflare Tunnel
# (the Pi has no public IPv4 to port-forward to), so no host port needs to be
# opened on the router for the CMS to be reachable.
#
#   docker compose up -d                  # worker + cms + cms-proxy + cloudflared
#   docker compose --profile full up -d   # web + api on the Pi too
#
# That's why `web` and `api` are in the `full` profile. Without a profile,
# `pull` and `up` skip them too, so the Pi doesn't needlessly download ~400 MB of images.
#
# The Pi never builds: GitHub Actions pushes the multi-arch images to
# GHCR, and only `docker compose pull && docker compose up -d` runs here.
#
# For local testing, docker-compose.override.yml is loaded automatically
# and builds these same services from source.
#
# Env vars: compose reads from the project root's `.env` file (both for interpolation
# and for injecting into the containers). Template: .env.docker.example

name: portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    # Only starts with the `full` profile: by default Vercel serves the frontend.
    profiles: [full]
    image: ${IMAGE_REGISTRY:-ghcr.io/answerrr}/portfolio-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # :80 -> plain HTTP; domain -> automatic Let's Encrypt TLS
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TZ: ${TZ:-Europe/Budapest}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Certificates must survive deploys, otherwise every restart requests a
      # new cert and hits the Let's Encrypt rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Deliberately service_started, not service_healthy: if the api is down for
      # some reason, the static page should still be served.
      api:
        condition: service_started
    networks: [portfolio]
    logging: *default-logging

  api:
    # Only starts with the `full` profile: by default the api/** handlers run
    # as Vercel Functions. Same code, two deploy targets.
    profiles: [full]
    image: ${IMAGE_REGISTRY:-ghcr.io/answerrr}/portfolio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-Europe/Budapest}
    # No published port: the api is only reachable on the internal network, through Caddy.
    expose:
      - "3001"
    networks: [portfolio]
    logging: *default-logging

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/answerrr}/portfolio-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-Europe/Budapest}
      TUYA_MSG_REGION: ${TUYA_MSG_REGION:-EU}
      # If > 0, the health endpoint returns 503 once this many ms have passed
      # without a Tuya message, and Docker restarts the container. Off by default:
      # message frequency is device-dependent.
      WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-0}
    networks: [portfolio]
    logging: *default-logging

  cms:
    # Always on, like `worker` — the blog CMS must be reachable regardless of
    # whether the unrelated `full` (web+api) profile is active. Vercel can't
    # host this: Payload needs a persistent server + DB connection, not a function.
    image: ${IMAGE_REGISTRY:-ghcr.io/answerrr}/portfolio-cms:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-Europe/Budapest}
      PORT: "3002"
    # No published port: only reachable through cms-proxy, same convention as `api`.
    expose:
      - "3002"
    networks: [portfolio]
    logging: *default-logging

  cms-proxy:
    # Stock Caddy image + a mounted Caddyfile — no custom build/image needed,
    # unlike `web` (which bundles static assets into its own image).
    image: caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      CMS_ADDRESS: ${CMS_ADDRESS:-:8081}
      TZ: ${TZ:-Europe/Budapest}
    ports:
      - "${CMS_HTTP_PORT:-8081}:80"
      - "${CMS_HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/Caddyfile.cms:/etc/caddy/Caddyfile:ro
      # Separate from web's caddy_data/caddy_config: both Caddy instances can run
      # concurrently under the `full` profile, and sharing ACME storage would corrupt it.
      - cms_caddy_data:/data
      - cms_caddy_config:/config
    depends_on:
      cms:
        condition: service_started
    networks: [portfolio]
    logging: *default-logging

  cloudflared:
    # The Pi is behind CGNAT (no public IPv4 to point a DNS A record at), so
    # instead of port-forwarding 80/443 on the router, a Cloudflare Tunnel makes
    # an outbound-only connection to Cloudflare's edge, which terminates public
    # TLS and reaches cms-proxy over this same internal docker network — no
    # inbound port ever needs to be opened. DNS + certs are managed entirely
    # from the Cloudflare Zero Trust dashboard, not from this compose file.
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      cms-proxy:
        condition: service_started
    networks: [portfolio]
    logging: *default-logging

networks:
  portfolio:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  cms_caddy_data:
  cms_caddy_config:
