name: Deploy to Raspberry Pi

# DEFAULT (push to master): the `worker` and `cms` (Payload blog backend) images
# are built and started on the Pi, plus the stock `cms-proxy` Caddy image, which
# is only ever pulled, never built. The webapp and API run on Vercel, deployed
# by Vercel's own pipeline for the same commit. Payload can't run on Vercel
# (needs a persistent server + DB connection), so it always deploys to the Pi
# regardless of the full_stack toggle below.
#
# The full stack (web + api + worker + cms) can be started on the Pi manually:
#   Actions -> Deploy to Raspberry Pi -> Run workflow -> check "full_stack".

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full_stack:
        description: "Also build the web + api images, and start them on the Pi (not just the worker)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # GHCR only allows lowercase image names; the metadata-action automatically
  # lowercases `${{ github.repository_owner }}`.
  IMAGE_PREFIX: ${{ github.repository_owner }}/portfolio

jobs:
  # ---------------------------------------------------------------------------
  # Decides which images need to be built. This way the build job stays a single
  # definition, instead of duplicating it per service.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan build
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      full_stack: ${{ steps.pick.outputs.full_stack }}

    steps:
      - name: Pick services to build
        id: pick
        run: |
          # `inputs.full_stack` is empty on a push event, so the default branch runs.
          # `cms` always builds — it deploys to the Pi regardless of full_stack.
          if [ "${{ inputs.full_stack }}" = "true" ]; then
            echo 'services=["worker","cms","api","web"]' >> "$GITHUB_OUTPUT"
            echo 'full_stack=true' >> "$GITHUB_OUTPUT"
          else
            echo 'services=["worker","cms"]' >> "$GITHUB_OUTPUT"
            echo 'full_stack=false' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Multi-arch image build + push to GHCR.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Only the `web` target consumes build args: Vite inlines the VITE_*
      # values at build time. The `secrets` context isn't available in `strategy`,
      # so this lives in its own step instead of the matrix.
      #
      # VITE_RECAPTCHA_SECRET_KEY is deliberately missing: it isn't referenced
      # anywhere in the code, and a secret has no business being in a client bundle.
      - name: Compose web build args
        if: matrix.service == 'web'
        run: |
          {
            echo 'BUILD_ARGS<<EOF'
            echo "VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}"
            echo "VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}"
            echo "VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}"
            echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # `cms` builds from its own Dockerfile (Next.js standalone output, no
      # arm64 cross-compile shortcut — see cms/Dockerfile for why); every
      # other service still builds from the root multi-target Dockerfile.
      - name: Resolve Dockerfile for this service
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "cms" ]; then
            echo "path=cms/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          target: ${{ matrix.service }}
          # The build stages run with --platform=$BUILDPLATFORM, so the heavy
          # work runs natively on amd64 once, and only the thin runtime layer
          # is built per architecture. If the Pi runs a 32-bit OS, linux/arm/v7
          # needs to be added here too.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: ${{ env.BUILD_ARGS }}

  # ---------------------------------------------------------------------------
  # Payload manages its own Postgres schema via migrations. `docker compose up`
  # alone won't apply them, so this runs them from the runner (which has network
  # access to Supabase) before the Pi's containers restart with the new image.
  # Runs unconditionally on every deploy — Payload's migration runner tracks
  # already-applied migrations, so a no-op run is harmless.
  # ---------------------------------------------------------------------------
  migrate:
    name: Run Payload migrations
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install cms dependencies
        run: pnpm install --frozen-lockfile --filter portfolio-cms...

      - name: Run migrations
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_DB_SCHEMA: ${{ vars.PAYLOAD_DB_SCHEMA || 'payload' }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: pnpm run cms:migrate

  # ---------------------------------------------------------------------------
  # The Pi never builds: it only receives the compose file and the .env, then
  # pulls the new images.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: [plan, build, migrate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fail fast, with a clear message: without this, the error is a bare
      # "docker: command not found" in the middle of the deploy script.
      - name: Check Docker on the Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USERNAME }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          script: |
            # The ssh-action doesn't start a login shell, so PATH may be narrower
            # than usual (same trap as the pm2 + pnpm shim before it).
            export PATH="$PATH:/usr/bin:/usr/local/bin"
            echo "arch: $(uname -m)"

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker is not installed on the Pi (or it's not on the non-interactive SSH PATH)."
              echo "One-time install on the Pi:"
              echo "  curl -fsSL https://get.docker.com | sh"
              echo "  sudo usermod -aG docker $USER"
              echo "  sudo systemctl enable --now docker"
              echo "  # then log out and back in via SSH so the group takes effect"
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: the Docker Compose v2 plugin is missing."
              echo "One-time install on the Pi: sudo apt-get install -y docker-compose-plugin"
              exit 1
            fi

            # The two possible causes (missing docker group vs. service not running)
            # need completely different fixes, so we print the actual error too.
            if ! docker_err="$(docker info 2>&1 >/dev/null)"; then
              echo "ERROR: the Docker daemon is not reachable."
              echo "--- docker info ---"
              echo "$docker_err"
              echo "--- diagnostics ---"
              echo "user:    $(id -un)"
              echo "groups:  $(id -nG)"
              if command -v systemctl >/dev/null 2>&1; then
                echo "service: $(systemctl is-active docker 2>&1) / $(systemctl is-enabled docker 2>&1)"
              fi
              ls -l /var/run/docker.sock 2>&1 || echo "socket:  /var/run/docker.sock does not exist"
              echo "--- what to do ---"
              if ! id -nG | tr ' ' '\n' | grep -qx docker; then
                # The socket is owned by root:docker with 660 permissions, so without
                # group membership the CLI can't reach the daemon even if the service is running.
                echo "=> '$(id -un)' is NOT in the 'docker' group. That's the cause."
                echo "   sudo usermod -aG docker $(id -un)"
                echo "   No need to log out for CI: the ssh-action opens a fresh session every run."
              elif command -v systemctl >/dev/null 2>&1 && [ "$(systemctl is-active docker 2>&1)" != "active" ]; then
                echo "=> The docker service is not running. That's the cause."
                echo "   sudo systemctl enable --now docker"
              else
                echo "=> Group membership and the service both look fine; the error above is the lead."
              fi
              exit 1
            fi

            echo "docker:  $(docker --version)"
            echo "compose: $(docker compose version --short)"

            # The old pm2-based worker writes into the same Supabase table as the container.
            # If both run, every Tuya datapoint gets inserted twice, which is hard to
            # clean up afterwards - so this deserves a loud warning.
            if command -v pm2 >/dev/null 2>&1 && pm2 describe tuya-worker >/dev/null 2>&1; then
              echo ""
              echo "WARNING: the old pm2-based 'tuya-worker' is still running on the Pi."
              echo "It will write DUPLICATE rows to Supabase alongside the container."
              echo "Stop it before the container starts:  pm2 delete tuya-worker && pm2 save"
              echo ""
            fi

      - name: Generate .env for the stack
        env:
          FULL_STACK: ${{ needs.plan.outputs.full_stack }}
        run: |
          # GHCR doesn't accept an uppercase namespace, but repository_owner can be one.
          registry="$(echo '${{ env.REGISTRY }}/${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "IMAGE_REGISTRY=$registry"
            echo "IMAGE_TAG=latest"
            # With COMPOSE_PROFILES empty, worker + cms + cms-proxy start. The `full`
            # profile additionally enables the web + api services.
            if [ "$FULL_STACK" = "true" ]; then
              echo "COMPOSE_PROFILES=full"
            else
              echo "COMPOSE_PROFILES="
            fi
            echo "SITE_ADDRESS=${{ vars.SITE_ADDRESS || ':80' }}"
            echo "TZ=${{ vars.TZ || 'Europe/Budapest' }}"
            echo "VITE_TUYA_API_BASE_URL=${{ vars.VITE_TUYA_API_BASE_URL || 'https://openapi.tuyaeu.com' }}"
            echo "VITE_TUYA_DEVICE_ID=${{ secrets.VITE_TUYA_DEVICE_ID }}"
            echo "TUYA_CLIENT_ID=${{ secrets.TUYA_CLIENT_ID }}"
            echo "TUYA_SECRET=${{ secrets.TUYA_SECRET }}"
            echo "TUYA_MSG_REGION=${{ vars.TUYA_MSG_REGION || 'EU' }}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}"
            echo "WORKER_STALE_AFTER_MS=${{ vars.WORKER_STALE_AFTER_MS || '0' }}"
            echo "CMS_ADDRESS=${{ vars.CMS_ADDRESS || ':8081' }}"
            echo "CMS_HTTP_PORT=${{ vars.CMS_HTTP_PORT || '8081' }}"
            echo "CMS_HTTPS_PORT=${{ vars.CMS_HTTPS_PORT || '8444' }}"
            echo "DATABASE_URI=${{ secrets.DATABASE_URI }}"
            echo "PAYLOAD_DB_SCHEMA=${{ vars.PAYLOAD_DB_SCHEMA || 'payload' }}"
            echo "PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}"
            echo "PAYLOAD_PUBLIC_SERVER_URL=${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}"
            echo "S3_BUCKET=${{ vars.S3_BUCKET || 'blog-media' }}"
            echo "S3_ENDPOINT=${{ secrets.SUPABASE_S3_ENDPOINT }}"
            echo "S3_REGION=${{ vars.S3_REGION || 'auto' }}"
            echo "S3_ACCESS_KEY_ID=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}"
            echo "S3_SECRET_ACCESS_KEY=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"
            echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
          } > .env

      - name: Copy stack files to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USERNAME }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "/var/www/portfolio"
          overwrite: true

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USERNAME }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          # The default 10m command_timeout isn't enough for a cold pull of the new
          # `cms` image (Next.js standalone + node_modules) onto the Pi's SD card —
          # first pull after this image starts existing extracted painfully slowly
          # and got killed by the default timeout. Later pulls only fetch diffs.
          command_timeout: 40m
          script: |
            set -e
            export PATH="$PATH:/usr/bin:/usr/local/bin"
            cd /var/www/portfolio
            # GITHUB_TOKEN is valid for the duration of the job run, and it's
            # enough for private GHCR packages too. If you make the packages public,
            # this login can be dropped (and a manual `docker compose pull` also works).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # COMPOSE_PROFILES comes from .env, so pull/up automatically applies to
            # the right set of services.
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            # The SD card has finite space: cleaning up replaced images isn't optional.
            docker image prune -f
            docker compose ps
