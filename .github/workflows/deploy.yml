name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ennek a setup-node ELŐTT kell futnia, különben a `cache: 'pnpm'` nem találja
      # a store elérési útját. Verzió nincs megadva: a package.json packageManager mezőjéből olvassa.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_RECAPTCHA_SECRET_KEY: ${{ secrets.VITE_RECAPTCHA_SECRET_KEY }}
        run: pnpm run build
        
      # This is not needed since it is hosted on Vercel currently
      # - name: Deploy frontend to Raspberry Pi
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.RASPBERRY_PI_HOST }}
      #     username: ${{ secrets.RASPBERRY_PI_USERNAME }}
      #     key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
      #     source: "dist"
      #     target: "/var/www/portfolio"
      #     strip_components: 1
      #     overwrite: true
          
      - name: Generate Worker .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > worker/.env
          echo "SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}" >> worker/.env
          echo "TUYA_CLIENT_ID=${{ secrets.TUYA_CLIENT_ID }}" >> worker/.env
          echo "TUYA_SECRET=${{ secrets.TUYA_SECRET }}" >> worker/.env
          echo "TUYA_MSG_REGION=EU" >> worker/.env

      - name: Deploy Worker to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USERNAME }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          # A pnpm-lock.yaml is megy, hogy a worker deps a repóval azonos, rögzített
          # verziókkal települjenek a Pi-n (korábban minden deploy friss feloldást csinált).
          source: "pnpm-lock.yaml,worker/src,worker/package.json,worker/tsconfig.json,worker/.env"
          target: "/var/www/portfolio-worker"
          overwrite: true

      - name: Install dependencies and restart Worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USERNAME }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          script: |
            cd /var/www/portfolio-worker/worker
            # --ignore-workspace + --lockfile-dir: csak a worker függőségei települjenek,
            # de a repó közös lockfile-jából. Sima `--filter` itt nem elég: megosztott
            # lockfile mellett a pnpm a workspace root deps-ét is telepítené
            # (pnpm/pnpm#7208), azaz a teljes frontendet a Pi-re.
            pnpm install --ignore-workspace --frozen-lockfile --lockfile-dir=..
            # A pm2 nem shellen át indít, a corepack/npm pnpm shimje pedig nem
            # feltétlenül van a pm2 daemon PATH-jában, ezért abszolút út kell.
            pm2 describe tuya-worker > /dev/null || pm2 start "$(command -v pnpm)" --name "tuya-worker" -- start
            pm2 restart tuya-worker
            pm2 save